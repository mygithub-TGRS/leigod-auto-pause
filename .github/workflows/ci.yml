name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 取全历史：上传自检的 -IncludeHistory 需要它，浅克隆下只会看到最新一次提交。
          fetch-depth: 0
      - name: Run Windows PowerShell release tests
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Test.ps1
      - name: Verify upload safety
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Verify-Upload.ps1 -IncludeHistory

  release-package:
    # 只有测试通过才产出二进制包；源码始终以仓库（tag）为唯一来源，
    # 发布页只需附带这个 artifact 与对应的 SHA256。
    needs: release-tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build release package
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Package.ps1 -SkipTests
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeigodAutoPause-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
