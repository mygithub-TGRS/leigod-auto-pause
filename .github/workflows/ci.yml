name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Windows PowerShell release tests
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\Test.ps1
