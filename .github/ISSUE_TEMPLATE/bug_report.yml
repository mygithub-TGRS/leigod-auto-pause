name: 缺陷报告
description: 报告一个可复现的问题（请勿附上 Token、完整日志或本机配置）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你反馈问题。请先阅读 `SECURITY.md`：**安全漏洞不要走这里**，请改用私密渠道。

        提交前请确认：**没有**粘贴 `account_token`、Cookie、雷神客户端原始日志
        （`http-*.log` / `main-*.log`）、完整 `app/config.json` 或含用户名的截图。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 控制台窗口左下角标注的版本，或 `LeigodAutoPause.exe` 的“文件版本”。
      placeholder: 例如 2.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2（22631.4169）
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 获取方式
      options:
        - 从本仓库源码自行构建
        - 从本仓库 Release 附件下载
        - 其他（请在复现步骤里说明）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写清操作，包含使用的配置项（可只写字段名与取值，不要贴整份配置）。
      placeholder: |
        1. 打开控制台，规则设置为 ...
        2. 启动雷神客户端并点“启动游戏”
        3. 退出游戏后等待 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如果有界面文案或页脚提示，请逐字贴出；日志请只贴必要的几行并去掉本机路径。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的诊断信息（可选）
      description: 可以贴控制台「诊断」页的“复制排障报告”结果，或 `LeigodAutoPause.ps1 -ValidateConfig` 的报错原文。
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 我已确认内容中没有 Token、Cookie、账号信息、完整日志或本机绝对路径。
          required: true
        - label: 我已阅读 README 的「已知限制」，并确认这不在其中。
          required: true
